packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Инструменты разработки и проверки.
  "@feature-sliced/steiger-plugin": 0.8.2
  "@types/node": 24.19.2
  eslint-plugin-turbo: 2.10.12
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  "steiger": 0.10.0
  turbo: "^2.11.11"
  "typescript": 6.0.3

  # Next.js и React.
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "next": 16.4.6
  "react": 19.2.8
  "react-dom": 19.2.8

  # Стили.
  "@tailwindcss/postcss": 4.3.5
  "postcss": 8.5.33
  "tailwindcss": 4.3.5
  "@base-ui/react": 1.9.0
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "class-variance-authority": 0.7.1
  "clsx": 2.1.1
  "lucide-react": 1.72.0
  "tailwind-merge": 3.7.0

  # Состояние, запросы и формы.
  "@hookform/resolvers": 7.0.6
  "@tanstack/react-query": 5.107.1
  "react-hook-form": 7.92.0
  "zustand": 5.1.0

  # NestJS и сервер.
  "@nestjs/cli": 12.0.13
  "@nestjs/common": 12.5.0
  "@nestjs/config": 12.1.1
  "@nestjs/core": 12.5.0
  "@nestjs/platform-express": 12.5.0
  "@nestjs/platform-socket.io": 12.5.0
  "@nestjs/swagger": 12.1.2
  "@nestjs/websockets": 12.5.0
  "@nestjs/mail": 0.0.2
  "reflect-metadata": 0.2.2
  "rxjs": 7.8.2

  # Доступ к базе данных.
  "@prisma/adapter-pg": 7.10.1
  "@prisma/client": 7.10.1
  "prisma": 7.10.1

  # Очереди задач.
  "@nestjs/bullmq": 12.0.2
  "bullmq": 6.7.6

  # Синхронизация и документ доски.
  "socket.io": 4.8.4
  "socket.io-client": 4.8.4
  "y-protocols": 1.0.7
  "yjs": 13.6.33

  # Валидация данных.
  "zod": 4.6.7

  # Тестирование.
  "@nestjs/testing": 12.5.0
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.10
  "@testing-library/jest-dom": 7.0.1
  "@storybook/nextjs-vite": 10.6.7
  "@storybook/react": 10.6.7
  "storybook": 10.6.7
  "storybook-addon-pseudo-states": 10.6.7
  "vite": 8.3.8
  "@vitejs/plugin-react": 6.3.0
  "jsdom": 31.0.1
  "msw": 3.0.6
  "vitest": 5.1.0

minimumReleaseAgeExclude:
  - "@oxlint-tsgolint/darwin-arm64@7.0.2007"
  - "@oxlint-tsgolint/darwin-x64@7.0.2007"
  - "@oxlint-tsgolint/linux-arm64@7.0.2007"
  - "@oxlint-tsgolint/linux-x64@7.0.2007"
  - "@oxlint-tsgolint/win32-arm64@7.0.2007"
  - "@oxlint-tsgolint/win32-x64@7.0.2007"
  - msw@3.0.6
  - oxlint-tsgolint@7.0.2007

# Oxlint исполняет плагин сам: его peer-зависимость от ESLint не нужна.
overrides:
  eslint-plugin-turbo@2.10.12>eslint: "-"

# Нативные модули и Prisma требуют сборки; телеметрия и генерация MSW при установке не нужны.
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  "msgpackr-extract": true
  msw: false
  prisma: true
  sharp: true
